[package]
name = "pancake2viper"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.18", features = ["derive"], optional = true }
clap-stdin = { version = "0.5.1", optional = true }
lazy_static = "1.5.0"
pest = "2.7.15"
pest_derive = "2.7.15"
regex = { version = "1.10.6", optional = true }
sexpr_parser = { version = "0.3.0", optional = true }
strum = { version = "0.26.3", features = ["derive"] }
thiserror = "1.0.64"
tracing = { version = "0.1.40", optional = true }
viper = { path = "../prusti/viper", optional = true }
tempfile = { version = "3.15.0", optional = true }

[features]
default = ["viper"]
# The Pancake front end: reading a program through `cake --explore` into
# the IR. Without it (and without `cli`/`viper`) the crate is the annotation
# parser and the IR alone — what a tool that reads `/@ … @/` contracts links.
pancake = ["dep:sexpr_parser", "dep:regex", "dep:tracing"]
# The command line (`cli`); the binary needs it and `viper`.
cli = ["dep:clap", "dep:clap-stdin"]
# The Viper backend: encoding the IR and running the verifier through the
# JVM. Without it there is no JVM at build or run time.
viper = ["dep:viper", "dep:tempfile", "pancake", "cli"]

[[bin]]
name = "pancake2viper"
required-features = ["viper"]
